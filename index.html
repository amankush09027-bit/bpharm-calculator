<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.Pharm Smart Calculator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef4f8;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#087f8c,#075985);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:10px 0 0;
    font-size:16px;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:10px 15px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:22px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#087f8c;
    font-size:27px;
}

label{
    display:block;
    font-size:17px;
    font-weight:bold;
    margin:18px 0 7px;
}

input,select{
    width:100%;
    padding:15px;
    font-size:17px;
    border:2px solid #d5dde4;
    border-radius:10px;
    background:white;
    color:#172033;
}

input:focus,select:focus{
    outline:none;
    border-color:#087f8c;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:10px;
    background:#087f8c;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.result{
    display:none;
    margin-top:18px;
    padding:17px;
    border-radius:10px;
    background:#e7f7f8;
    border-left:5px solid #087f8c;
    font-size:18px;
    line-height:1.6;
}

.error{
    background:#fff0f0;
    border-left-color:#d32f2f;
    color:#c62828;
}

.footer{
    text-align:center;
    padding:25px;
    color:#666;
    font-size:14px;
}
