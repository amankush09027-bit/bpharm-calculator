<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.Pharm Smart Calculator</title>

<style>
body{
    font-family:Arial;
    background:#eef4f8;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#087f8c;
}

.box{
    max-width:500px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px #ccc;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0 15px;
    box-sizing:border-box;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    background:#087f8c;
    color:white;
    border:0;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#e5f7f8;
    border-radius:8px;
    font-size:20px;
    text-align:center;
}
</style>
</head>

<body>

<h1>💊 B.Pharm Smart Calculator</h1>

<div class="box">

<h2>Angle of Repose</h2>

<label>Height (h) in cm</label>

<input id="h" type="number" placeholder="Enter height">

<label>Radius (r) in cm</label>

<input id="r" type="number" placeholder="Enter radius">

<button id="calculate">Calculate</button>

<div id="result"></div>

</div>

<script>

document.getElementById("calculate").addEventListener("click", function(){

    var h = Number(document.getElementById("h").value);
    var r = Number(document.getElementById("r").value);

    if(h <= 0 || r <= 0){

        document.getElementById("result").innerHTML =
        "❌ Please enter valid values.";

        return;
    }

    var angle = Math.atan(h / r) * 180 / Math.PI;

    document.getElementById("result").innerHTML =
    "✅ Angle of Repose = <b>" +
    angle.toFixed(2) +
    "°</b>";

});

</script>

</body>
    </html>
